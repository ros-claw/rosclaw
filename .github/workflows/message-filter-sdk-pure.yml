name: Message Filter SDK Pure

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "examples/ros/message_filter_sdk/**"
      - ".github/workflows/message-filter-sdk-pure.yml"
  push:
    branches: [main]
    paths:
      - "examples/ros/message_filter_sdk/**"
      - ".github/workflows/message-filter-sdk-pure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned pure-test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Verify exact copies and run minimal fixture without ROS
        env:
          ARCHIVE_ROOT: ${{ runner.temp }}/mf01-archives
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          TEST_TMP: ${{ runner.temp }}/mf01-pytest
        run: |
          timeout 15s python -I -B examples/ros/message_filter_sdk/verify_publication.py --extract-root "$ARCHIVE_ROOT"
          timeout 45s python -I -B -m pytest -q -c /dev/null --noconftest -p no:cacheprovider --basetemp "$TEST_TMP-minimal" "$ARCHIVE_ROOT/minimal_fixture/test_message_filter_scenario.py"
