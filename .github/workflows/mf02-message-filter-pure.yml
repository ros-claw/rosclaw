name: MF02 Message Filter Pure

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "examples/ros/message_filter_sync/**"
      - ".github/workflows/mf02-message-filter-pure.yml"
  push:
    branches: [main]
    paths:
      - "examples/ros/message_filter_sync/**"
      - ".github/workflows/mf02-message-filter-pure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify archives and run exact stdlib-only pure14
        env:
          ARCHIVE_ROOT: ${{ runner.temp }}/mf02-public-archives
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          timeout 15s python -I -B examples/ros/message_filter_sync/verify_publication.py --extract-root "$ARCHIVE_ROOT"
          timeout 45s python -I -B examples/ros/message_filter_sync/replay_pure.py --fixture-root "$ARCHIVE_ROOT/minimal_fixture"
