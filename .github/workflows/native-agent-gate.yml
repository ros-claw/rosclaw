# Native Agent Gate（三审 PR-NA-13 + 五审 PR-HF5-5 Gate Evidence V2）：
# Gate E 进 CI，不是一次性报告。
#
#   journey      安装产物 PTY 全旅程（含产品面断言 + 脱敏全链证据）
#   tui-pty      IME/resize/tmux 矩阵
#   perf         §30 交互性能（regression 宽线，artifact 上传原始样本）
#   soak         100 启停 + 资源趋势
#
# Evidence V2（五审 §11）：
# - main push exact-commit run（merge commit 不再无证据）；
# - 每 job（含 soak）统一 manifest v2：checked_out_sha（真实 checkout
#   commit，不是 ref 名）/head_sha/base_sha/event_name/workflow_hash；
# - path filters 覆盖安全依赖（contracts/migrations/daemon/limo）——
#   这些文件单独变化不再绕过 Gate；
# - 证据 Gate 的 Actions pin full commit SHA（由 updater PR 维护）；
# - journey 上传脱敏机器可读证据：sanitized_assertions.json（全 ID 链
#   + hash + verdicts）、session_structure.json（类型/计数，无正文）、
#   installed_bundle_digest.txt、junit.xml——第三方仅下载 artifact
#   即可复核 context→approval→grant→txn→receipt 全链。
#
# 路径过滤：重型 PR/push job；nightly 全量。

name: Native Agent Gate

on:
  pull_request:
    branches: [main, develop]
    paths: &gate-paths
      - "packages/rosclaw-agent/**"
      - "src/rosclaw/agentd/**"
      - "src/rosclaw/operatord/**"
      - "src/rosclaw/operator/**"
      - "src/rosclaw/contracts/**"
      - "src/rosclaw/storage/migrations/**"
      - "src/rosclaw/daemon/**"
      - "src/rosclaw/limo/**"
      - "src/rosclaw/setup_cli.py"
      - "src/rosclaw/root_cli.py"
      - "src/rosclaw/entrypoint.py"
      - "scripts/build_release.sh"
      - "scripts/ci/**"
      - "tests/agentd/**"
      - "tests/ci/**"
      - ".github/workflows/native-agent-gate.yml"
  push:
    branches: [main]
    paths: *gate-paths
  schedule:
    - cron: "17 3 * * *" # nightly 全量（不路径过滤）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    name: Product Journey (installed artifact PTY)
    runs-on: ubuntu-latest
    # 七审 PR-SEVEN-7：三旅程（A 默认安全 SIM / B ask-every-time /
    # C REAL 边界）各自 build+install+PTY——超时 30→75。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run product journey
        id: run
        run: |
          .venv/bin/python -m pytest tests/agentd/test_product_journey.py tests/agentd/test_hf5_4_action_result_ui.py -q --tb=short \
            --junitxml=/tmp/junit-journey.xml
      # 六审 §9.2.4：publishable 证据先 curate 成单份（pytest-0/
      # pytest-current/test_*0/test_*current 的 glob 会把同一 PTY 日志
      # 打包多份）。
      - name: Curate evidence pack
        if: always()
        run: |
          set -e
          PACK=/tmp/evidence-pack
          mkdir -p "$PACK"
          SRC=$(ls -dt /tmp/pytest-of-*/pytest-*/test_full_journey_pty0 2>/dev/null | head -1)
          JRB=$(ls -dt /tmp/pytest-of-*/pytest-*/test_journey_b_ask_every_time0 2>/dev/null | head -1)
          JRC=$(ls -dt /tmp/pytest-of-*/pytest-*/test_journey_c_real_boundary0 2>/dev/null | head -1)
          HF=$(ls -dt /tmp/pytest-of-*/pytest-*/hf5_40 2>/dev/null | head -1)
          for f in fake-requests.jsonl sanitized_assertions.json session_structure.json installed_bundle_digest.txt journey-scope.json; do
            [ -f "$SRC/$f" ] && cp "$SRC/$f" "$PACK/journey-$f"
          done
          # 七审 PR-SEVEN-7：Journey B/C 证据（B 有全链 sanitized
          # evidence；C 的边界证明是 scope + DB 零 REAL 工件断言）。
          for f in sanitized_assertions.json journey-scope.json; do
            # `|| true`：glob 未命中时 [ -f ] 返回 1——set -e 下会杀掉
            # 整个 curation 步骤（#289 首次 CI 实测）。
            [ -f "$JRB/$f" ] && cp "$JRB/$f" "$PACK/journey-b-$f" || true
          done
          [ -f "$JRC/journey-scope.json" ] && cp "$JRC/journey-scope.json" "$PACK/journey-c-journey-scope.json" || true
          [ -f "$HF/fake-requests.jsonl" ] && cp "$HF/fake-requests.jsonl" "$PACK/hf5_4-fake-requests.jsonl"
          [ -f /tmp/junit-journey.xml ] && cp /tmp/junit-journey.xml "$PACK/junit.xml"
          ls -la "$PACK"
      - name: Upload journey evidence (publishable, sanitized)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-evidence-${{ github.sha }}
          path: /tmp/evidence-pack/**
          if-no-files-found: error
          retention-days: 30
      # 六审 §9.2.5：restricted 诊断（完整 PTY/失败 DB）仅失败时上传、
      # 短保留——publishable 与 restricted 分离。
      - name: Upload failure diagnostics (restricted)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-diagnostics-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_full_journey_pty0/pty-*.log
            /tmp/pytest-of-*/pytest-*/test_full_journey_pty0/failure-dump/**
            /tmp/pytest-of-*/pytest-*/test_journey_b_ask_every_time0/pty-*.log
            /tmp/pytest-of-*/pytest-*/test_journey_b_ask_every_time0/failure-dump/**
            /tmp/pytest-of-*/pytest-*/test_journey_c_real_boundary0/pty-*.log
            /tmp/pytest-of-*/pytest-*/test_journey_c_real_boundary0/failure-dump/**
            /tmp/pytest-of-*/pytest-*/hf5_40/pty-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Write evidence manifest
        if: always()
        env:
          GITHUB_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_SELECTION: "pytest tests/agentd/test_product_journey.py tests/agentd/test_hf5_4_action_result_ui.py"
          TEST_CONCLUSION: ${{ steps.run.outcome }}
          BUNDLE_DIGEST: ${{ hashFiles('/tmp/evidence-pack/installed_bundle_digest.txt') }}
        run: |
          SCOPE=/tmp/evidence-pack/journey-journey-scope.json
          if [ -f "$SCOPE" ]; then
            export INSTALL_ORIGIN=$(python3 -c "import json;print(json.load(open('$SCOPE'))['install_origin'])")
            export CONFIG_ORIGIN=$(python3 -c "import json;print(json.load(open('$SCOPE'))['config_origin'])")
            export ROBOT_KIT_DIGEST=$(python3 -c "import json;print(json.load(open('$SCOPE'))['robot_kit_digest'])")
            export SOURCE_CHECKOUT_ACCESSIBLE=$(python3 -c "import json;print(str(json.load(open('$SCOPE'))['source_checkout_accessible']).lower())")
          fi
          bash scripts/ci/write_evidence_manifest.sh "${{ github.job }}" /tmp/evidence/evidence-manifest.json
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  tui-pty:
    name: TUI PTY Matrix (IME/resize/tmux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run TUI PTY matrix
        run: |
          .venv/bin/python -m pytest tests/agentd/test_tui_ime.py tests/agentd/test_tmux_env.py -q --tb=short \
            --junitxml=/tmp/junit-tui-pty.xml
      - name: Upload TUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tui-evidence-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_cjk_paste_resize*/fake-requests.jsonl
            /tmp/pytest-of-*/pytest-*/test_chat_inside_tmux*/fake-requests.jsonl
            /tmp/junit-tui-pty.xml
          if-no-files-found: error
          retention-days: 30

      - name: Write evidence manifest
        if: always()
        env:
          GITHUB_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_SELECTION: "pytest tests/agentd/test_tui_ime.py tests/agentd/test_tmux_env.py"
        run: bash scripts/ci/write_evidence_manifest.sh "${{ github.job }}" /tmp/evidence/evidence-manifest.json
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  perf-regression:
    name: Perf Regression Gate (shared runner, wide limits)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run interaction perf
        run: |
          .venv/bin/python -m pytest tests/agentd/test_interaction_perf.py -q -s --tb=short \
            --junitxml=/tmp/junit-perf.xml
      - name: Upload perf evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-report-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_perf_thresholds*/perf-report.json
            /tmp/junit-perf.xml
          if-no-files-found: error
          retention-days: 90

      - name: Write evidence manifest
        if: always()
        env:
          GITHUB_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_SELECTION: "pytest tests/agentd/test_interaction_perf.py"
        run: bash scripts/ci/write_evidence_manifest.sh "${{ github.job }}" /tmp/evidence/evidence-manifest.json
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  soak:
    name: Start/Exit Soak (100 cycles, resource trends)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run 100x start/exit soak
        run: |
          .venv/bin/python -m pytest tests/agentd/test_start_exit_soak.py -q --tb=short \
            --junitxml=/tmp/junit-soak.xml
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soak-trend-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_hundred_start_exit_cycles*/soak-trend.txt
            /tmp/junit-soak.xml
          if-no-files-found: error
          retention-days: 90

      # 五审 §11.2：soak 此前是唯一没有 manifest 的 job。
      - name: Write evidence manifest
        if: always()
        env:
          GITHUB_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_SELECTION: "pytest tests/agentd/test_start_exit_soak.py"
        run: bash scripts/ci/write_evidence_manifest.sh "${{ github.job }}" /tmp/evidence/evidence-manifest.json
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  # 六审 §9.3：独立验证——由生成证据的同一个测试自我声明不算数；
  # 本 job 下载 artifact 后离线复核全链 ID/hash/状态关系。
  evidence-verify:
    name: Journey Evidence Verify (independent)
    needs: [journey]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Download journey evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: journey-evidence-${{ github.sha }}
          path: /tmp/downloaded-evidence
      - name: Verify sanitized assertions independently
        run: |
          set -e
          ls -la /tmp/downloaded-evidence
          python scripts/ci/verify_journey_evidence.py /tmp/downloaded-evidence/journey-sanitized_assertions.json
          # 七审 PR-SEVEN-7：Journey B（ask-every-time）全链证据同样
          # 独立复核（含 journey scope）。
          python scripts/ci/verify_journey_evidence.py /tmp/downloaded-evidence/journey-b-sanitized_assertions.json
      - name: Download journey manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evidence-manifest-journey-${{ github.sha }}
          path: /tmp/downloaded-manifest
      - name: Verify manifest fields
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          manifests = list(Path("/tmp/downloaded-manifest").glob("*.json"))
          assert manifests, "manifest artifact 为空"
          m = json.loads(manifests[0].read_text())
          required = ("checked_out_sha", "head_sha", "base_sha", "event_name",
                      "workflow_hash", "test_conclusion", "bundle_digest",
                      "evidence_schema_version")
          missing = [f for f in required if f not in m]
          assert not missing, f"manifest 缺字段: {missing}"
          assert m["schema_version"] == "rosclaw.gate_evidence.v2"
          assert m["evidence_schema_version"] == "rosclaw.journey_evidence.v2"
          # 七审 PR-SEVEN-7：manifest 必须携带 journey scope——
          # clean-install 证据链的机器可读边界。
          assert m.get("install_origin") == "release_tarball", m.get("install_origin")
          assert m.get("config_origin") == "generated_no_server_fixtures"
          assert str(m.get("robot_kit_digest", "")).startswith("sha256:")
          assert m.get("source_checkout_accessible") is False
          print("manifest fields OK:", {k: m[k] for k in required})
          PY
