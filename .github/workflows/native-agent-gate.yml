# Native Agent Gate（三审 PR-NA-13）：Gate E 进 CI，不是一次性报告。
#
# 此前 5 个关键 Gate E 测试全部 @pytest.mark.slow，Full Regression 跑
# 'not slow'——CI 全绿不证明 journey/IME/soak/perf 没被后续合并破坏。
# 本 workflow 把它们变成真实 CI 门禁：
#
#   journey      安装产物 PTY 全旅程（含产品面断言）
#   tui-pty      IME/resize/tmux 矩阵
#   perf         §30 交互性能（regression 宽线，artifact 上传原始样本）
#   soak         100 启停 + 资源趋势
#
# 所有 job 上传机器可读 evidence（perf-report.json / soak-trend.txt /
# fake-requests.jsonl），经 run id + SHA 绑定。
#
# 路径过滤：只在 Native Agent/agentd/operatord/release 相关文件变化时
# 运行（重型 PR job）；nightly 全量。

name: Native Agent Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/rosclaw-agent/**"
      - "src/rosclaw/agentd/**"
      - "src/rosclaw/operatord/**"
      - "src/rosclaw/operator/**"
      - "src/rosclaw/setup_cli.py"
      - "src/rosclaw/root_cli.py"
      - "src/rosclaw/entrypoint.py"
      - "scripts/build_release.sh"
      - "tests/agentd/**"
      - ".github/workflows/native-agent-gate.yml"
  schedule:
    - cron: "17 3 * * *" # nightly 全量（不路径过滤）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    name: Product Journey (installed artifact PTY)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run product journey
        run: |
          .venv/bin/python -m pytest tests/agentd/test_product_journey.py -q --tb=short
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_full_journey_pty*/fake-requests.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Write evidence manifest
        if: always()
        run: |
          mkdir -p /tmp/evidence
          cat > /tmp/evidence/evidence-manifest.json <<EOF
          {
            "schema_version": "rosclaw.gate_evidence.v1",
            "job": "${{ github.job }}",
            "head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "merge_ref_sha": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}",
            "node_version": "$(node --version)",
            "python_version": "$(.venv/bin/python --version 2>/dev/null || python --version)",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  tui-pty:
    name: TUI PTY Matrix (IME/resize/tmux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run TUI PTY matrix
        run: |
          .venv/bin/python -m pytest tests/agentd/test_tui_ime.py tests/agentd/test_tmux_env.py -q --tb=short
      - name: Upload TUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-evidence-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_cjk_paste_resize*/fake-requests.jsonl
            /tmp/pytest-of-*/pytest-*/test_chat_inside_tmux*/fake-requests.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Write evidence manifest
        if: always()
        run: |
          mkdir -p /tmp/evidence
          cat > /tmp/evidence/evidence-manifest.json <<EOF
          {
            "schema_version": "rosclaw.gate_evidence.v1",
            "job": "${{ github.job }}",
            "head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "merge_ref_sha": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}",
            "node_version": "$(node --version)",
            "python_version": "$(.venv/bin/python --version 2>/dev/null || python --version)",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  perf-regression:
    name: Perf Regression Gate (shared runner, wide limits)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run interaction perf
        run: |
          .venv/bin/python -m pytest tests/agentd/test_interaction_perf.py -q -s --tb=short
      - name: Upload perf evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_perf_thresholds*/perf-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Write evidence manifest
        if: always()
        run: |
          mkdir -p /tmp/evidence
          cat > /tmp/evidence/evidence-manifest.json <<EOF
          {
            "schema_version": "rosclaw.gate_evidence.v1",
            "job": "${{ github.job }}",
            "head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "merge_ref_sha": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}",
            "node_version": "$(node --version)",
            "python_version": "$(.venv/bin/python --version 2>/dev/null || python --version)",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  soak:
    name: Start/Exit Soak (100 cycles, resource trends)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run 100x start/exit soak
        run: |
          .venv/bin/python -m pytest tests/agentd/test_start_exit_soak.py -q --tb=short
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-trend-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_hundred_start_exit_cycles*/soak-trend.txt
          if-no-files-found: error
          retention-days: 90
