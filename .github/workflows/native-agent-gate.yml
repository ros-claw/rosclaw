# Native Agent Gate（三审 PR-NA-13 + 五审 PR-HF5-5 Gate Evidence V2）：
# Gate E 进 CI，不是一次性报告。
#
#   journey      安装产物 PTY 全旅程（含产品面断言 + 脱敏全链证据）
#   tui-pty      IME/resize/tmux 矩阵
#   perf         §30 交互性能（regression 宽线，artifact 上传原始样本）
#   soak         100 启停 + 资源趋势
#
# Evidence V2（五审 §11）：
# - main push exact-commit run（merge commit 不再无证据）；
# - 每 job（含 soak）统一 manifest v2：checked_out_sha（真实 checkout
#   commit，不是 ref 名）/head_sha/base_sha/event_name/workflow_hash；
# - path filters 覆盖安全依赖（contracts/migrations/daemon/limo）——
#   这些文件单独变化不再绕过 Gate；
# - 证据 Gate 的 Actions pin full commit SHA（由 updater PR 维护）；
# - journey 上传脱敏机器可读证据：sanitized_assertions.json（全 ID 链
#   + hash + verdicts）、session_structure.json（类型/计数，无正文）、
#   installed_bundle_digest.txt、junit.xml——第三方仅下载 artifact
#   即可复核 context→approval→grant→txn→receipt 全链。
#
# 路径过滤：重型 PR/push job；nightly 全量。

name: Native Agent Gate

on:
  pull_request:
    branches: [main, develop]
    paths: &gate-paths
      - "packages/rosclaw-agent/**"
      - "src/rosclaw/agentd/**"
      - "src/rosclaw/operatord/**"
      - "src/rosclaw/operator/**"
      - "src/rosclaw/contracts/**"
      - "src/rosclaw/storage/migrations/**"
      - "src/rosclaw/daemon/**"
      - "src/rosclaw/limo/**"
      - "src/rosclaw/setup_cli.py"
      - "src/rosclaw/root_cli.py"
      - "src/rosclaw/entrypoint.py"
      - "scripts/build_release.sh"
      - "scripts/ci/**"
      - "tests/agentd/**"
      - "tests/ci/**"
      - ".github/workflows/native-agent-gate.yml"
  push:
    branches: [main]
    paths: *gate-paths
  schedule:
    - cron: "17 3 * * *" # nightly 全量（不路径过滤）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    name: Product Journey (installed artifact PTY)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run product journey
        run: |
          .venv/bin/python -m pytest tests/agentd/test_product_journey.py tests/agentd/test_hf5_4_action_result_ui.py -q --tb=short \
            --junitxml=/tmp/junit-journey.xml
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-evidence-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_full_journey_pty*/fake-requests.jsonl
            /tmp/pytest-of-*/pytest-*/test_full_journey_pty*/pty-*.log
            /tmp/pytest-of-*/pytest-*/test_full_journey_pty*/failure-dump/**
            /tmp/pytest-of-*/pytest-*/test_full_journey_pty*/sanitized_assertions.json
            /tmp/pytest-of-*/pytest-*/test_full_journey_pty*/session_structure.json
            /tmp/pytest-of-*/pytest-*/test_full_journey_pty*/installed_bundle_digest.txt
            /tmp/junit-journey.xml
          if-no-files-found: error
          retention-days: 30

      - name: Write evidence manifest
        if: always()
        env:
          GITHUB_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_SELECTION: "pytest tests/agentd/test_product_journey.py tests/agentd/test_hf5_4_action_result_ui.py"
        run: bash scripts/ci/write_evidence_manifest.sh "${{ github.job }}" /tmp/evidence/evidence-manifest.json
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  tui-pty:
    name: TUI PTY Matrix (IME/resize/tmux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run TUI PTY matrix
        run: |
          .venv/bin/python -m pytest tests/agentd/test_tui_ime.py tests/agentd/test_tmux_env.py -q --tb=short \
            --junitxml=/tmp/junit-tui-pty.xml
      - name: Upload TUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tui-evidence-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_cjk_paste_resize*/fake-requests.jsonl
            /tmp/pytest-of-*/pytest-*/test_chat_inside_tmux*/fake-requests.jsonl
            /tmp/junit-tui-pty.xml
          if-no-files-found: error
          retention-days: 30

      - name: Write evidence manifest
        if: always()
        env:
          GITHUB_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_SELECTION: "pytest tests/agentd/test_tui_ime.py tests/agentd/test_tmux_env.py"
        run: bash scripts/ci/write_evidence_manifest.sh "${{ github.job }}" /tmp/evidence/evidence-manifest.json
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  perf-regression:
    name: Perf Regression Gate (shared runner, wide limits)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run interaction perf
        run: |
          .venv/bin/python -m pytest tests/agentd/test_interaction_perf.py -q -s --tb=short \
            --junitxml=/tmp/junit-perf.xml
      - name: Upload perf evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-report-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_perf_thresholds*/perf-report.json
            /tmp/junit-perf.xml
          if-no-files-found: error
          retention-days: 90

      - name: Write evidence manifest
        if: always()
        env:
          GITHUB_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_SELECTION: "pytest tests/agentd/test_interaction_perf.py"
        run: bash scripts/ci/write_evidence_manifest.sh "${{ github.job }}" /tmp/evidence/evidence-manifest.json
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  soak:
    name: Start/Exit Soak (100 cycles, resource trends)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Python deps (repo .venv — build_release.sh 依赖它)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest pytest-asyncio
      - name: Install Node deps (rosclaw-agent)
        run: |
          cd packages/rosclaw-agent
          npm ci
      - name: Run 100x start/exit soak
        run: |
          .venv/bin/python -m pytest tests/agentd/test_start_exit_soak.py -q --tb=short \
            --junitxml=/tmp/junit-soak.xml
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soak-trend-${{ github.sha }}
          path: |
            /tmp/pytest-of-*/pytest-*/test_hundred_start_exit_cycles*/soak-trend.txt
            /tmp/junit-soak.xml
          if-no-files-found: error
          retention-days: 90

      # 五审 §11.2：soak 此前是唯一没有 manifest 的 job。
      - name: Write evidence manifest
        if: always()
        env:
          GITHUB_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_SELECTION: "pytest tests/agentd/test_start_exit_soak.py"
        run: bash scripts/ci/write_evidence_manifest.sh "${{ github.job }}" /tmp/evidence/evidence-manifest.json
      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-manifest-${{ github.job }}-${{ github.sha }}
          path: /tmp/evidence/evidence-manifest.json
          if-no-files-found: error
          retention-days: 90
