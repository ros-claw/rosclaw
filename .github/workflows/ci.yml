name: SDK primary collection only
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  macos-sdk-primary-only:
    name: Read-only macOS SDK and installed MuJoCo primary (no camera)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.0
    - name: Set up Python 3.11
      uses: actions/setup-python@v6.3.0
      with:
        python-version: '3.11'
    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        version: latest
    - name: Install dependencies
      run: uv pip install -e ".[dev]" --system
    - name: Collect read-only SDK headers and installed renderer bytes
      run: python -B .github/diagnostics/collect_macos_sdk_only_ROOT_ONLY.py --output
        "$RUNNER_TEMP/root-macos-sdk-primary"
    - name: Preserve primary evidence even on missing include or mismatch
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: root-macos-sdk-primary
        path: ${{ runner.temp }}/root-macos-sdk-primary
        if-no-files-found: error
        retention-days: 7
