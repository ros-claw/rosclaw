name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  sim-cross-platform:
    # G47 Cross-platform Qualification（MH26 PARTIAL → PASS）：sim
    # harness 套件（含代表机器人矩阵 + 干净 wheel 冒烟）在 ubuntu x86_64
    # 与 macOS（Apple Silicon）真跑——不只 aarch64 Linux 单平台证据。
    name: Sim Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      # 渲染探测需要 libosmesa6（与 full-regression 同款纪律：缺库
      # 渲染测试诚实失败，不跳过——ubuntu 装库拿真渲染证据）。
      - name: Install headless GL (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 xvfb

      # macOS 平台事实：hosted runner 无 egl/osmesa、glfw 需 display——
      # 两个真渲染 oracle 测试在 macOS 上诚实 NOT_RUN（显式 deselect +
      # 门表记录），其余全部真跑（含 claim_without_evidence 阴性用例）。
      - name: Run sim harness suite (ubuntu, full incl. render)
        if: runner.os == 'Linux'
        run: >-
          pytest
          tests/sim
          tests/eval/mujoco_harness_live
          -q
          -m 'not integration and not deployment'

      - name: Run sim harness suite (macOS, render NOT_RUN honestly)
        if: runner.os == 'macOS'
        run: >-
          pytest
          tests/sim
          tests/eval/mujoco_harness_live
          -q
          -m 'not integration and not deployment'
          --deselect tests/eval/mujoco_harness_live/test_oracle_v2_synthetic.py::test_v01_locate_with_camera_evidence
          --deselect tests/eval/mujoco_harness_live/test_oracle_v2_synthetic.py::test_v01_wrong_position
