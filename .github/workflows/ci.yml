name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run ruff check
        run: ruff check src tests

  node-tui-unit:
    name: Node TUI Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: packages/rosclaw-tui/package-lock.json
      - run: npm ci
        working-directory: packages/rosclaw-tui
      - run: npm test
        working-directory: packages/rosclaw-tui

  node-agent-unit:
    name: Node Agent Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: packages/rosclaw-agent/package-lock.json
      - run: npm ci
        working-directory: packages/rosclaw-agent
      # P0-6：bubblewrap——OS 隔离实证测试（凭据遮蔽/无网络/越界
      # 只读）需要真 bwrap；user namespace 在 ubuntu runner 可用。
      - name: Install bubblewrap (OS isolation proof tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm test
        working-directory: packages/rosclaw-agent

  node-modeld-unit:
    name: Node modeld Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: packages/rosclaw-modeld/package-lock.json
      - run: npm ci
        working-directory: packages/rosclaw-modeld
      - run: npm test
        working-directory: packages/rosclaw-modeld

  evidence-pack-verify:
    name: Evidence Pack Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Run acceptance + evidence pack tests
        run: python -m pytest tests/agentd/test_evidence_pack.py -q
      - name: Produce acceptance evidence pack
        run: python scripts/ci/produce_demo_evidence.py /tmp/evidence-ci
      - name: Verify pack offline
        run: python -m rosclaw.entrypoint evidence verify /tmp/evidence-ci/acceptance/*/
      - name: Upload evidence pack
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-pack
          path: /tmp/evidence-ci/acceptance/
          retention-days: 30

  cross-uid-operator-e2e:
    name: Cross-UID Operator E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Build and run four-UID operator e2e
        run: bash scripts/e2e/operator_cross_uid/run.sh

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run focused mypy
        run: >-
          mypy --config-file .github/mypy-ci.ini
          src/rosclaw/kernel
          src/rosclaw/daemon
          src/rosclaw/sandbox
          src/rosclaw/runtime/doctor_levels.py
          src/rosclaw/provider/core
          src/rosclaw/mcp_drivers
          src/rosclaw/mcp/adapters
          src/rosclaw/mcp/onboarding
          src/rosclaw/robot_pack
          src/rosclaw/agent
          src/rosclaw/agent_runtime/mcp_hub.py
          src/rosclaw/integrations/lerobot/execution
          src/rosclaw/integrations/lerobot/rollout/rh56_execute.py
          src/rosclaw/integrations/lerobot/rollout/rh56_shadow.py
          src/rosclaw/connectors/ros/provider/ros_capability_provider.py
          src/rosclaw/connectors/ros/mcp/tools.py
          src/rosclaw/core/runtime.py
          src/rosclaw/cli.py
          src/rosclaw/body
          src/rosclaw/firstboot
          src/rosclaw/hub

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run tests
        run: >-
          pytest
          tests/agent
          tests/daemon
          tests/mcp
          tests/kernel
          tests/sandbox/test_reach_episode.py
          tests/runtime/test_doctor_levels.py
          tests/provider
          tests/security
          tests/practice
          tests/robot_pack
          tests/product
          tests/body
          tests/test_mcp_drivers.py
          tests/test_mcp_drivers_coverage.py
          tests/test_mujoco_driver.py
          tests/test_firstboot.py
          tests/test_firstboot_config.py
          tests/test_config_profile.py
          tests/test_doctor_json.py
          tests/test_cli.py
          tests/test_skill_manager.py
          tests/test_skill_metadata.py
          tests/test_realsense_capture_rgbd_skill.py
          -m 'not integration and not deployment'
          -v
          --cov=src/rosclaw
          --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  full-regression:
    name: Full Regression (Python 3.11)
    runs-on: ubuntu-latest
    # 七审合并级联实测：套件在 20 分钟处超时被 cancel（87%）——
    # 审计轮次累积的测试让套件超过预算。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      # WP-3：OSMesa 软渲染库——CI runner 无 GPU/EGL，MuJoCo 离屏渲染
      # 后端探测需要 libosmesa6（缺库时渲染测试诚实失败，不跳过）。
      - name: Install OSMesa (MuJoCo offscreen rendering)
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 xvfb

      - name: Run full non-deployment suite
        run: pytest -q -m 'not slow and not integration and not deployment'

  product-acceptance:
    name: Product Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install default runtime
        run: uv pip install -e . --system

      - name: Check canonical status
        run: python scripts/product/render_status.py --check

      - name: Run first verified receipt
        run: scripts/acceptance/first_verified_receipt.sh

      - name: Run Agent MCP black-box
        run: scripts/acceptance/agent_blackbox.sh

      - name: Run rosclawd boundary black-box
        run: scripts/acceptance/daemon_blackbox.sh

      - name: Run clean wheel install
        run: scripts/acceptance/clean_install.sh

  cross-uid-boundary:
    name: Cross-UID Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Build root-owned wheel environment
        run: |
          umask 022
          uvx hatch build -t wheel
          wheel="$(find dist -maxdepth 1 -name 'rosclaw-*.whl' -print -quit)"
          test -n "${wheel}"
          sudo -n "$(command -v python)" -m venv --copies /opt/rosclaw-crossuid-ci
          sudo -n "$(command -v uv)" pip install "${wheel}" \
            --python /opt/rosclaw-crossuid-ci/bin/python
          sudo -n chown -R root:root /opt/rosclaw-crossuid-ci
          sudo -n chmod -R go-w /opt/rosclaw-crossuid-ci

      - name: Run clean-wheel cross-UID boundary acceptance
        run: ROSCLAW_ACCEPTANCE_PYTHON=/opt/rosclaw-crossuid-ci/bin/python scripts/acceptance/daemon_cross_uid.sh

      - name: Remove wheel environment
        if: always()
        run: sudo -n rm -rf /opt/rosclaw-crossuid-ci

  hub-test:
    name: Hub Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run Hub tests
        run: pytest tests/hub -v

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, full-regression]
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run integration tests
        run: python scripts/integration_test.py

  deployment-test:
    name: ROS Docker Deployment Test
    runs-on: ubuntu-latest
    # 冷缓存构建 ROS 2 Humble 镜像 + smoke 可能超过 15 分钟（环境性，
    # 与代码无关）；此前暖缓存 2m18s 通过掩盖了这一点。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run ROS deployment smoke test
        run: pytest tests/connectors/ros/integration/test_ros2_container_smoke.py -v -m deployment

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, full-regression, product-acceptance, cross-uid-boundary]
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install hatch

      # P0-5：wheel 打构建戳——安装一致性诊断（mixed build 检测）。
      - name: Stamp wheel build commit
        run: |
          python - <<'PY'
          import json, os
          with open("src/rosclaw/_build_stamp.json", "w") as fh:
              json.dump({"commit": os.environ["GITHUB_SHA"]}, fh)
          PY

      - name: Build package
        run: hatch build

      - name: Verify wheel runtime resources
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          required = {
              "rosclaw/_build_stamp.json",
              "rosclaw/kernel/action_gateway.py",
              "rosclaw/runtime/doctor_levels.py",
              "rosclaw/sandbox/episode.py",
              "rosclaw/eurdf_zoo_data/ur5e/robot.mjcf.xml",
              "rosclaw/rh56_data/configs/rh56_right_rs485_v1.yaml",
              "rosclaw/rh56_data/configs/rh56_right_01_calibration.yaml",
              "rosclaw/rh56_data/policies/rh56_reference_policy_v1/config.json",
              "rosclaw/rh56_data/policies/rh56_reference_policy_v1/model.safetensors",
              "rosclaw/benchmarks/memory/run_benchmark.py",
              "rosclaw/robot_pack/packs/realsense-d400/robot-pack.yaml",
              "rosclaw/robot_pack/packs/realsense-d400/checksums.txt",
              "rosclaw/robot_pack/packs/realsense-d400/capabilities/camera.capture_rgbd.yaml",
              "rosclaw/robot_pack/packs/realsense-d400/docs/README.md",
              "rosclaw/robot_pack/packs/realsense-d400/examples/capture-action.json",
              "rosclaw/robot_pack/packs/realsense-d400/policies/perception-only.yaml",
              "rosclaw/robot_pack/packs/realsense-d400/signatures/manifest.ed25519",
              "rosclaw/robot_pack/packs/realsense-d400/verification/read-only.yaml",
              "rosclaw/robot_pack/trust/keys.json",
              "rosclaw/hub/trust/keys.json",
              "lerobot_policy_rosclaw_rh56/__init__.py",
          }
          missing = sorted(required - names)
          assert not missing, f"wheel missing runtime resources: {missing}"
          meshes = [
              name
              for name in names
              if name.startswith("rosclaw/eurdf_zoo_data/ur5e/assets/")
              and name.endswith(".obj")
          ]
          assert len(meshes) >= 20, f"wheel contains only {len(meshes)} UR5e meshes"
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/rosclaw
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
