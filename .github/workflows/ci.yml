name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  deployment-test:
    name: ROS Docker Deployment Test
    runs-on: ubuntu-latest
    # 冷缓存构建 ROS 2 Humble 镜像 + smoke 可能超过 15 分钟（环境性，
    # 与代码无关）；此前暖缓存 2m18s 通过掩盖了这一点。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run ROS deployment smoke test
        run: pytest tests/connectors/ros/integration/test_ros2_container_smoke.py -v -m deployment
