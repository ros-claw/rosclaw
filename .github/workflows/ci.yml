name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  cgl-finite-diagnostic:
    name: Native CGL finite diagnostic (macOS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-latest
        python-version:
        - '3.11'
    steps:
    - uses: actions/checkout@v7.0.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        version: latest
    - name: Install dependencies
      run: uv pip install -e ".[dev]" --system
    - name: Observe one bounded Native CGL diagnostic
      run: python -B .github/diagnostics/root_cgl_finite_observer.py
    timeout-minutes: 10
