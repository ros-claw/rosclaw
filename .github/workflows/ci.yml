name: PR694 Original Sim Camera Independent Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim-cross-platform:
    # G47 Cross-platform Qualification（MH26 PARTIAL → PASS）：sim
    # harness 套件（含代表机器人矩阵 + 干净 wheel 冒烟）在 ubuntu x86_64
    # 与 macOS（Apple Silicon）真跑——不只 aarch64 Linux 单平台证据。
    name: Sim Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      # 渲染探测需要 libosmesa6（与 full-regression 同款纪律：缺库
      # 渲染测试诚实失败，不跳过——ubuntu 装库拿真渲染证据）。
      - name: Install headless GL (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 xvfb

      # macOS 平台事实：hosted runner 无 egl/osmesa、glfw 需 display——
      # 两个真渲染 oracle 测试在 macOS 上诚实 NOT_RUN（显式 deselect +
      # 门表记录），其余全部真跑（含 claim_without_evidence 阴性用例）。
      - name: Gate reviewed selected8 declarations and installed primary
        if: runner.os == 'macOS'
        run: >-
          python -B .github/diagnostics/selected8_gate_ROOT_ONLY.py
          --manifest "$GITHUB_WORKSPACE/.github/diagnostics/SELECTED8_PRIMARY_MANIFEST.json"
          --manifest-sha256 e6a1e421798e3a7e44abda1b1b930b50349a3ab8e8c64e316fbfb452ae43d994
          --root-authority "$GITHUB_WORKSPACE/.github/diagnostics/ROOT_SELECTED8_AUTHORITY.json"
          --root-authority-sha256 52bd6bef9ce338909cf042c427d3b7a2c34e38c06098c4ac4e2dce460cbd6a16
          --factory "$GITHUB_WORKSPACE/src/rosclaw/sim/backends/mujoco/owned_renderer.py"
          --result "$RUNNER_TEMP/root-selected8-gate.json"

      - name: Run sim harness suite (ubuntu, full incl. render)
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/diagnostics
          PYTEST_PLUGINS: root_original_camera_observer
          ROOT_CAMERA_OBSERVER_RESULT: ${{ runner.temp }}/root_original_camera_return.json
        run: >-
          pytest
          tests/sim
          tests/eval/mujoco_harness_live
          -q
          -m 'not integration and not deployment'

      - name: Run sim harness suite (macOS, render NOT_RUN honestly)
        if: runner.os == 'macOS'
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/diagnostics
          PYTEST_PLUGINS: root_original_camera_observer
          ROOT_CAMERA_OBSERVER_RESULT: ${{ runner.temp }}/root_original_camera_return.json
        run: >-
          pytest
          tests/sim
          tests/eval/mujoco_harness_live
          -q
          -m 'not integration and not deployment'
          --deselect tests/eval/mujoco_harness_live/test_oracle_v2_synthetic.py::test_v01_locate_with_camera_evidence
          --deselect tests/eval/mujoco_harness_live/test_oracle_v2_synthetic.py::test_v01_wrong_position

      - name: Upload independent original camera observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr694-original-camera-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/root-selected8-gate.json
            ${{ runner.temp }}/root_original_camera_return.json
          if-no-files-found: warn
          retention-days: 30
