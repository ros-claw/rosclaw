name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  full-regression:
    name: Full Regression (Python 3.11)
    runs-on: ubuntu-latest
    # 七审合并级联实测：套件在 20 分钟处超时被 cancel（87%）——
    # 审计轮次累积的测试让套件超过预算。
    # R0-3/R0-5：真实 3D 场景渲染进入回归（recipe scene 节点 +
    # 场景媒体核验）——两次 30 分钟 timeout-cancel 实证；预算随
    # 真实渲染覆盖提升到 45（与 native-agent-gate 最重档一致）。
    # 0902 复核批实证：R2 渲染器测试（overlay 像素证据）+ holdout
    # 套件把套件推过 45 分钟（run 33844510892 精确 45 分钟被
    # cancel）——预算 60。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      # WP-3：OSMesa 软渲染库——CI runner 无 GPU/EGL，MuJoCo 离屏渲染
      # 后端探测需要 libosmesa6（缺库时渲染测试诚实失败，不跳过）。
      - name: Install OSMesa (MuJoCo offscreen rendering)
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 xvfb

      - name: Set up Node for recorded continuation prerequisites
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: packages/rosclaw-agent/package-lock.json

      - name: Install locked agent dependencies for recorded continuation
        run: npm ci --include=dev
        working-directory: packages/rosclaw-agent

      - name: Build agent CLI for recorded continuation
        run: npm run build
        working-directory: packages/rosclaw-agent

      - name: Run full non-deployment suite
        # 0911 验证：套件已并行安全（collection 确定性 sorted 参数化 +
        # AF_UNIX 短路径修复；本地 -n 8 全量实证 7245 通过零并行噪声）。
        # loadfile 保持文件内顺序（文件内顺序依赖不受影响）。
        # perf_serial（墙钟 SLO/基准）在并行负载下测量失真（main
        # bdcb115 实证 849ms>600ms 误红）——并行段排除、串行段补跑。
        run: pytest -q -n auto --dist loadfile -m 'not slow and not integration and not deployment and not perf_serial'

      - name: Run perf_serial suite (serial — wall-clock measurements must be unloaded)
        run: pytest -q -p no:xdist -m 'perf_serial and not slow and not integration and not deployment'
