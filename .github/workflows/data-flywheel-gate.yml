# Data Flywheel Gate (DF-16A) — full-data-flywheel CI profile.
#
# The main ci.yml jobs install only `.[dev]`; this workflow is the acceptance
# profile that proves the whole data plane runs with its REAL dependencies:
# seekdb (pyseekdb), embedding, knowledge (rosclaw-know / rosclaw-how).
#
# Gates:
#   A. Import / contract — every data-plane package must import, no skips
#   B. Focused — the data-plane test suites
#   C. Full regression — 0 unexpected failures / collection errors
#   D. Static — ruff, mypy, compileall, git diff --check
name: Data Flywheel Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Required backend: missing/unknown capability is a hard CI failure.
      # EGL is optional only on exact fresh native-loader absence evidence.
      ROSCLAW_REQUIRED_RENDERER_BACKENDS: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install full data-flywheel extras
        run: uv pip install -e ".[dev,seekdb,embedding,knowledge]" --system

      # WP-3: provision the required software offscreen backend. Package
      # installation is not capability proof; do not assume hosted EGL absence.
      - name: Install OSMesa (MuJoCo offscreen rendering)
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 xvfb

      # Renderer phase only (separate RootGO from SOURCE-only validation).
      # Genuine constructor assertion, then exact production-prefix matrix.
      # Optional EGL NOT_RUN entries remain skipped with typed detection
      # evidence in JUnit; they must never be reported as full 8/8 PASS.
      - name: Renderer capability — required offscreen construction and matrix
        run: |
          pytest tests/test_harnessbench_vision_oracle.py -q -rA \
            -k 'required_renderer_backend_offscreen_capability or real_worker_renderer_platform_matrix' \
            -o junit_family=legacy --junitxml=renderer-capability.xml

      - name: Preserve renderer capability evidence (including failures and NOT_RUN)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-capability-evidence
          path: renderer-capability.xml
          if-no-files-found: error

      - name: Gate A — import / contract
        run: |
          python - <<'PY'
          import rosclaw
          import rosclaw.storage
          import rosclaw.memory.v2
          import rosclaw.knowledge
          import rosclaw.how
          import rosclaw.evolution
          import rosclaw.darwin
          import rosclaw_know
          import rosclaw_know.contracts
          import rosclaw_how
          import pyseekdb
          print("Gate A OK")
          PY

      - name: Gate B — focused data-plane suites
        run: |
          pytest tests/storage tests/memory tests/practice tests/how \
            tests/knowledge tests/darwin tests/evolution -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: |
            packages/rosclaw-agent/package-lock.json
            packages/rosclaw-tui/package-lock.json

      - name: Install locked agent SDK dependencies and build
        working-directory: packages/rosclaw-agent
        run: |
          npm ci
          npm run build

      - name: Install locked TUI dependencies and build
        working-directory: packages/rosclaw-tui
        run: |
          npm ci
          npm run build

      - name: Gate C — full regression (no unexpected failures)
        # Mirror ci.yml's regression selector: deployment tests drive
        # scripts/build_release.sh, which requires a repo-local .venv that
        # a --system CI install deliberately does not create.
        run: pytest tests -q -m 'not slow and not integration and not deployment'

      - name: Gate D — static
        run: |
          ruff check src tests
          mypy src/rosclaw
          python -m compileall -q src/rosclaw
          git diff --check

      - name: Gate E — live acceptance (embedded, 50 episodes + hurt gate)
        run: |
          python validation/data_flywheel/scripts/run_live_acceptance.py \
            --episodes 50 --hurt-gate \
            --workdir /tmp/data_flywheel_live \
            --report validation/data_flywheel/reports/live_acceptance.json

      - name: Gate E — harness unit tests
        run: pytest validation/data_flywheel/tests -q

      - name: Gate G — SeekDB regression matrix (T0-T15, real embedded engine)
        # PR-SDB-140-1: the #251 surface + rosclaw-level paths on the real
        # embedded engine; runs on every SDK/engine upgrade from now on.
        # Own process: pylibseekdb allows one embedded target per process.
        run: pytest tests/integration/seekdb -q -m 'integration'

      - name: Gate F — Golden Flywheel (§42-§44 final acceptance)
        # Separate process from Gate E: pylibseekdb allows one embedded
        # target per process.  Needs mujoco (already in the profile for
        # the simforge suites).
        run: |
          python validation/golden_flywheel/scripts/run_golden_flywheel.py \
            --workdir /tmp/golden_flywheel_live
          pytest validation/golden_flywheel/tests -q
