schema_version: rosclaw.robot_pack.v1

pack:
  namespace: ros-claw
  name: limo-ros1
  version: 0.1.27
  title: AgileX LIMO ROS 1 Guarded Patrol Pack
  summary: Permit-gated localization, navigation, tones, and bounded speech for AgileX LIMO on ROS Melodic.
  vendor: AgileX Robotics
  kind: mobile_base
  aliases: [limo, agilex-limo]

compatibility:
  os: [linux]
  arch: [x86_64, aarch64]
  python: ">=3.11,<3.14"
  ros_distributions: [melodic]

components:
  - kind: body
    id: limo-body
    ref: builtin://eurdf/limo
    version: 1.0.0
  - kind: hardware_adapter
    id: limo-ros-mcp
    ref: https://github.com/ros-claw/limo-ros-mcp
    version: 7b71f9611782317fc43c51a48af2aeae230c47b3
    required: true
  - kind: capability
    id: limo-set-initial-pose
    ref: rosclaw://capability/limo.set_initial_pose@1
