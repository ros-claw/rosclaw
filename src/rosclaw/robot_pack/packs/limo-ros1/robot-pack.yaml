  - kind: documentation
    id: limo-pack-docs
    ref: docs://robot-pack/limo-ros1
    path: docs/README.md
    digest: sha256:fef2c7f5b96a37f5cbfb2032f62f8c68f2709889cbd431188f4bdff8680ca8a5

device:
  type: mobile_base
  vendor_ids: ["1a86"]
  variants:
    - model: LIMO
      model_patterns: ["AgileX LIMO", "LIMO"]
      product_ids: ["7523"]
      body_profile: limo

discovery:
  backend: manual
  fallback_backends: [manual]
  required_identity_fields: [model, serial, stable_uri, backend]

adapter:
  component_id: limo-ros-mcp
  transport: mcp_stdio
  server_name_patterns: [limo-ros-mcp]
  tools:
    - id: initial-pose
      any_of: [limo_request_initial_pose]
    - id: navigation
      any_of: [limo_request_navigation]
    - id: speaker-tone
      any_of: [limo_request_tone]
    - id: speaker-speech
      any_of: [limo_request_speech]
  direct_driver_access: forbidden

capabilities:
  - id: limo.set_initial_pose
    title: Initialize AMCL pose estimate
    safety_class: actuation
    adapter_component_id: limo-ros-mcp
    adapter_tools_any_of: [limo_request_initial_pose]
    execution_modes: [SHADOW, REAL]
    required_evidence: TASK_VERIFIED
  - id: limo.navigate_to_pose
    title: Navigate to a patrol waypoint
    safety_class: actuation
    adapter_component_id: limo-ros-mcp
    adapter_tools_any_of: [limo_request_navigation]
    execution_modes: [SHADOW, REAL]
    required_evidence: TASK_VERIFIED
  - id: limo.play_tone
    title: Play a bounded synthesized speaker tone
    safety_class: actuation
    adapter_component_id: limo-ros-mcp
    adapter_tools_any_of: [limo_request_tone]
    execution_modes: [SHADOW, REAL]
    required_evidence: TASK_VERIFIED
  - id: limo.speak_text
    title: Speak a bounded synthesized message
    safety_class: actuation
    adapter_component_id: limo-ros-mcp
    adapter_tools_any_of: [limo_request_speech]
    execution_modes: [SHADOW, REAL]
    required_evidence: TASK_VERIFIED

safety:
  perception_only: false
  actuation: guarded
  direct_driver_access: forbidden
  agent_southbound_access: daemon_only

verification:
  - id: contract
    target_tier: H1_CONTRACT_VERIFIED
    checks:
      - signed-pack-integrity
      - platform-compatibility
      - body-profile-availability
      - daemon-loader-contract
      - revision-locked-worker
    requires_hardware: false
  - id: actuation
    target_tier: H4_HARDWARE_ACTUATION_VERIFIED
    checks:
      - exact-action-permit
      - initialpose-subscriber-ack
      - post-dispatch-amcl-pose
      - map-to-odom-transform
      - navigation-daemon-preflight
      - navigation-goal-and-stop
      - tone-microphone-loopback
      - speech-microphone-loopback
      - canonical-execution-receipt
    requires_hardware: true
    requires_independent_observer: true

support:
  baseline_tier: H1_CONTRACT_VERIFIED
  candidate_tier: H4_HARDWARE_ACTUATION_VERIFIED
  evidence_ids: [limo-ros1-robot-pack-contract-tests]

integrity:
  checksums_file: checksums.txt
  signature:
    required: true
    scheme: ed25519
    key_id: rosclaw-limo-pack-v9
    file: signatures/manifest.ed25519
    payload: manifest-and-checksums-v1
