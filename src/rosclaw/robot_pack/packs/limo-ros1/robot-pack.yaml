    path: capabilities/limo.play_tone.yaml
    digest: sha256:f7c07dcb6a35215a07506fa054e7e534fba4b3f68417e4eca13600298daae52d
  - kind: capability
    id: limo-speak-text
    ref: rosclaw://capability/limo.speak_text@1
    version: "1"
    path: capabilities/limo.speak_text.yaml
    digest: sha256:d1aa520a64f00bfb27091b83fb29ce1b7d69e9ab2bf0d9bbd0b7f72359acd465
  - kind: policy
    id: limo-initial-pose-policy
    ref: rosclaw://policy/limo-initial-pose@1
    version: "1"
    path: policies/initial-pose.yaml
    digest: sha256:ba4834ead5c1287a5394cb658ef9eac2b59755144c1635fa2a223cb8be224595
  - kind: policy
    id: limo-patrol-actions-policy
    ref: rosclaw://policy/limo-patrol-actions@1
    version: "1"
    path: policies/patrol-actions.yaml
