schema_version: rosclaw.robot_pack.verification.v1
id: limo-patrol-actuation
pack: rosclaw://robot_pack/ros-claw/limo-ros1@0.1.9
stage: actuation
requires:
  hardware: true
  independent_observer_for_tier: true
checks:
  - id: exact-action-permit
    pass: daemon authorization is bound to the exact action intent and Body snapshot
  - id: initialpose-subscriber-ack
    pass: AMCL subscribes before the worker publishes
  - id: post-dispatch-amcl-pose
    pass: a finite map-frame AMCL pose converges near the requested estimate within the bounded timeout
  - id: map-to-odom-transform
    pass: the ROS TF graph contains map to odom after initialization
  - id: canonical-execution-receipt
    pass: rosclawd persists a TASK_VERIFIED terminal receipt
  - id: navigation-daemon-preflight
    pass: the fixed worker validates lidar, odometry, chassis status, live map-to-base TF, and move_base before dispatch and subscribes to AMCL for preferred post-dispatch verification
  - id: navigation-goal-and-stop
    pass: move_base reaches SUCCEEDED, the final AMCL or live map-to-base TF pose is within tolerance, odometry motion is observed whenever the goal was outside active planner tolerance, and odometry reports stopped
  - id: tone-driver-ack
    pass: the fixed PulseAudio or ALSA backend accepts every bounded synthesized frame with single-stage PCM volume and the previous output state is restored
promotion:
  candidate_tier: H4_HARDWARE_ACTUATION_VERIFIED
  automatic: false
  reason: independent physical observation evidence must be reviewed
