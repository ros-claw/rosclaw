schema_version: rosclaw.capability.v1
id: limo.navigate_to_pose
title: Navigate to a map-frame patrol waypoint
input:
  type: object
  additionalProperties: false
  properties:
    schema_version:
      const: limo.navigation.v2
    target_pose:
      type: object
      additionalProperties: false
      properties:
        frame_id: {const: map}
        x: {type: number, minimum: -50.0, maximum: 50.0}
        y: {type: number, minimum: -50.0, maximum: 50.0}
        yaw: {type: number, minimum: -3.141592653589793, maximum: 3.141592653589793}
      required: [frame_id, x, y, yaw]
    readiness_snapshot_hash:
      type: string
      minLength: 1
    route_policy_id:
      type: string
      minLength: 1
    route_policy_hash:
      type: string
      minLength: 1
    map_id:
      type: string
      minLength: 1
    map_image_hash:
      type: string
      minLength: 1
    goal_tolerance:
      type: object
      additionalProperties: false
      properties:
        xy_m: {type: number, minimum: 0.05, maximum: 0.5}
        yaw_rad: {type: number, minimum: 0.05, maximum: 0.8}
      required: [xy_m, yaw_rad]
    expected_effect:
      const:
        kind: navigate_to_pose
        final_frame: map
        stop_required: true
  required: [schema_version, target_pose, readiness_snapshot_hash, route_policy_id, route_policy_hash, map_id, map_image_hash, goal_tolerance, expected_effect]
output:
  required: [observed_final_pose, stopped_odometry, motion_evidence, receipt]
safety:
  class: actuation
  actuation: guarded
  direct_driver_access: forbidden
  gateway: rosclawd
execution:
  modes: [SHADOW, REAL]
  adapter: limo-ros-mcp
  worker: worker/limo_navigation_worker.py
  operation: NAVIGATE_TO_POSE
evidence:
  minimum: TASK_VERIFIED
  predicates:
    - daemon-owned-ros-preflight
    - move-base-succeeded
    - final-amcl-within-tolerance
    - stopped-odometry
    - active-planner-tolerance-recorded
    - odometry-displacement-classified
  limitations:
    - physical-motion-not-independently-observed
