schema_version: rosclaw.capability.v1
id: limo.play_tone
title: Play one bounded synthesized speaker tone
input:
  type: object
  additionalProperties: false
  properties:
    schema_version:
      const: limo.tone.v1
    frequency_hz:
      type: integer
      enum: [440, 660, 880]
    duration_sec:
      type: number
      minimum: 0.2
      maximum: 1.0
    volume_percent:
      type: integer
      minimum: 5
      maximum: 25
    expected_effect:
      const:
        kind: speaker_tone
        playback_required: true
        mixer_restore_required: true
        microphone_loopback_required: true
  required: [schema_version, frequency_hz, duration_sec, volume_percent, expected_effect]
output:
  required: [device, frame_count, volume_mapping, digital_peak_scale, mixer_restored, acoustic_loopback, acoustic_loopback_detected, receipt]
safety:
  class: actuation
  actuation: guarded
  direct_driver_access: forbidden
  gateway: rosclawd
execution:
  modes: [SHADOW, REAL]
  adapter: limo-ros-mcp
  worker: worker/limo_tone_worker.py
  operation: PLAY_TONE
evidence:
  minimum: TASK_VERIFIED
  predicates:
    - alsa-frames-accepted
    - single-stage-pcm-volume
    - onboard-microphone-target-frequency-observed
    - target-frequency-gain-above-baseline
    - target-frequency-prominence-above-adjacent-bands
    - output-state-restored
  limitations:
    - human-hearing-not-confirmed
    - onboard-microphone-cannot-exclude-electronic-crosstalk
